name: Check knowledge reviewer
on:
  push:
    paths: ['cache/records_audit.py', 'cache/check_reviewer.py', '.github/workflows/cache-reviewer-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python -m venv "$RUNNER_TEMP/model"
          echo "$RUNNER_TEMP/model/bin" >> "$GITHUB_PATH"
      - run: |
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --only-binary=:all: transformers==4.57.3
          python cache/records_audit.py --download
      - env:
          HF_HUB_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python cache/check_reviewer.py
