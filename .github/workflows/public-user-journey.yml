name: Public npm user journey
on:
  push:
    branches: [acceptance/npm-user-journey]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Install the supported Codex CLI
        run: npm install --global @openai/codex@0.165.0
      - shell: bash
        run: python3 ci/public-user-journey.py
  reproduce-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: levencode-labs/deploom-mcp
          ref: 068f27b2aa4c83b75ca86b41c89e4ed960355010
          path: build/contracts
          persist-credentials: false
      - name: Reconstruct exact audit input from the public refs
        run: |
          git fetch --no-tags https://github.com/levencode-labs/deploom-npm.git refs/pull/18/head refs/pull/17/head
          python -m venv "$RUNNER_TEMP/reviewer"
          echo "$RUNNER_TEMP/reviewer/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/reviewer/bin/python" -m pip install --only-binary=:all: jsonschema==4.25.1
          export PYTHONPATH=build/contracts/src
          py="$RUNNER_TEMP/reviewer/bin/python"
          "$py" cache/records_intake.py 32c747f470f92609ac01694fb1c3a292d9177d47 "$RUNNER_TEMP/18.json" --head 3eae00e5fdae8bcc3a6800fbbf0f3b874ab32467
          "$py" cache/records_intake.py 8b823e3141d6ee0d8d958f6e484a87ce01b0a510 "$RUNNER_TEMP/17.json" --head 4ea511a3d02312ecf3bf48141bc1277442a97790
      - name: Load pinned reviewer
        run: |
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --only-binary=:all: transformers==4.57.3
          python cache/records_audit.py --download
      - name: Observe verdict at the existing strict comparison
        env:
          PYTHONPATH: cache
          HF_HUB_OFFLINE: '1'
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          import records_audit
          for number in (17,18):
              def trace(frame,event,arg):
                  if frame.f_code is records_audit.audit.__code__ and event == 'return':
                      choice = frame.f_locals.get('choice')
                      print(f"PR {number} decoded verdict: {ascii(choice)}")
                  return trace if frame.f_code is records_audit.audit.__code__ else None
              sys.settrace(trace)
              try:
                  records_audit.audit(json.loads((Path(os.environ['RUNNER_TEMP']) / f'{number}.json').read_bytes()))
              except ValueError as error:
                  if number != 18 or str(error) != 'AI review requires a maintainer':
                      raise
              finally:
                  sys.settrace(None)
          PY
      - name: Submit the fork's historical install control to the unchanged validator and reviewer
        env:
          PYTHONPATH: build/contracts/src
          HF_HUB_OFFLINE: '1'
        run: |
          base=8b823e3141d6ee0d8d958f6e484a87ce01b0a510
          head=662d8d5ecddeec6a5be925ab7c590e38f4c3b65d
          git fetch --no-tags origin refs/heads/replay/external-install-observation
          test "$(git rev-parse FETCH_HEAD)" = "$head"
          git diff --exit-code "$base" HEAD -- cache/records_intake.py cache/records_audit.py cache/sign-records.cjs
          python cache/records_intake.py "$base" "$RUNNER_TEMP/test-report.json" --head "$head"
          python cache/records_audit.py "$RUNNER_TEMP/test-report.json"
          python cache/records_intake.py "$base" "$RUNNER_TEMP/baseline.json"
          git worktree add --detach "$RUNNER_TEMP/trial-base" "$base"
          git -C "$RUNNER_TEMP/trial-base" -c user.name=Staging -c user.email=staging@example.invalid merge --squash "$head"
          git -C "$RUNNER_TEMP/trial-base" -c user.name=Staging -c user.email=staging@example.invalid commit -m 'Qualified data-only update'
          merged=$(git -C "$RUNNER_TEMP/trial-base" rev-parse HEAD)
          python cache/records_intake.py "$merged" "$RUNNER_TEMP/test-cache.json"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deliver to the published MCP using a disposable staging signing identity
        run: |
          export HOME="$RUNNER_TEMP/staging-home" XDG_DATA_HOME="$RUNNER_TEMP/staging-data"
          mkdir -p "$HOME"
          npm install --prefix "$HOME/client" @openai/codex@0.165.0
          export PATH="$HOME/client/node_modules/.bin:$PATH"
          (cd "$HOME" && npm exec --yes --package=@levencode/deploom -- deploom setup codex)
          base="$XDG_DATA_HOME/DepLoom/public"
          ver=$(jq -er .version "$base/clients/codex/active.json")
          "$base/versions/$ver/bin/python3.13" -I -B ci/staging-readback.py "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/test-cache.json"
