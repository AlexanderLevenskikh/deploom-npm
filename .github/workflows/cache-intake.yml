name: Knowledge PR admission
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
permissions: {}
concurrency:
  group: records-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  audit:
    if: >-
      github.repository == 'levencode-labs/deploom-npm' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.validate.outputs.eligible }}
      route: ${{ steps.paths.outputs.route }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect path list before fetching any contributor blobs
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          ADDED: ${{ github.event.pull_request.additions }}
          REMOVED: ${{ github.event.pull_request.deletions }}
        run: |
          set -euo pipefail
          # GitHub truncates the files API at 3000; a partial list cannot qualify.
          if (( CHANGED > 3000 )); then exit 1; fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[] | [.filename,.previous_filename,.status] | @json' > "$RUNNER_TEMP/paths"
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows = [json.loads(s) for s in (Path(os.environ['RUNNER_TEMP']) / 'paths').read_text().splitlines()]
          allowed = {'docs/v1/history.json', 'docs/v1/knowledge.json'}
          touches = any(name in allowed or old in allowed for name,old,_ in rows)
          if len(rows) != int(os.environ['CHANGED']):
              raise SystemExit('Incomplete PR path inventory')
          only_data = touches and len(rows) <= 2 and all(name in allowed and not old and status == 'modified'
                                                         for name,old,status in rows)
          if only_data and int(os.environ['ADDED']) + int(os.environ['REMOVED']) > 300:
              raise SystemExit('Data change exceeds the review budget')
          route = 'data' if only_data else ('mixed' if touches else 'code')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('data=' + str(only_data).lower(), file=output)
              print('route=' + route, file=output)
          PY
      - name: Create a job-local Python environment
        if: steps.paths.outputs.data == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/intake-venv"
          echo "$RUNNER_TEMP/intake-venv/bin" >> "$GITHUB_PATH"
      - name: Read candidate as bounded Git blobs; keep the worktree at the trusted base
        if: steps.paths.outputs.data == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --filter=blob:limit=2m origin "refs/pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.paths.outputs.data == 'true'
        with:
          repository: levencode-labs/deploom-mcp
          ref: 068f27b2aa4c83b75ca86b41c89e4ed960355010
          path: build/contracts
          persist-credentials: false
      - run: 'python -m pip install --only-binary=:all: jsonschema==4.25.1'
        if: steps.paths.outputs.data == 'true'
      - id: validate
        if: steps.paths.outputs.data == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: build/contracts/src
        run: python cache/records_intake.py "$BASE" "$RUNNER_TEMP/review.json" --head "$HEAD_SHA"
      - name: Load pinned public weights and CPU inference runtime
        if: steps.validate.outputs.eligible == 'true'
        run: |
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --only-binary=:all: transformers==4.57.3
          python cache/records_audit.py --download
      - name: Require an unambiguous positive verdict for every record
        if: steps.validate.outputs.eligible == 'true'
        env:
          HF_HUB_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python cache/records_audit.py "$RUNNER_TEMP/review.json"

  review-required:
    needs: audit
    if: always() && (needs.audit.result == 'failure' || needs.audit.outputs.route == 'mixed')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create security-review-required --repo "$GITHUB_REPOSITORY" --color B60205 --description "Knowledge intake needs maintainer review" || gh label list --repo "$GITHUB_REPOSITORY" --search security-review-required
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=security-review-required'

  receipt:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish the required admission result on the exact PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.audit.result }}
          ROUTE: ${{ needs.audit.outputs.route }}
        run: |
          state=failure
          description='Admission incomplete or a risk was identified'
          if [[ "$RESULT" == success && "$ROUTE" == data ]]; then
            state=success; description='Registry, evidence and model checks passed'
          elif [[ "$RESULT" == success && ( "$ROUTE" == code || "$ROUTE" == mixed ) ]]; then
            state=success; description='Maintainer review required; automation cannot approve this change'
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context=records-admission -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  merge:
    needs: [audit, receipt]
    if: needs.audit.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Approve and squash only the audited commit after ordinary PR checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/pulls/$PR"
          checked() {
            test "$(gh api "$endpoint" --jq '[.state,.draft,.base.ref,.base.sha,.head.sha] | @tsv')" = "$(printf 'open\tfalse\tmain\t%s\t%s' "$BASE_SHA" "$HEAD_SHA")" &&
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA" &&
            test "$(gh api "$endpoint" --jq '[.labels[].name] | contains(["security-review-required"])')" = false
          }
          checked
          # Native PR checks can initially be absent. Require the ordinary public-data check to appear.
          seen=false
          for attempt in {1..80}; do
            checked
            checks=$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json workflow,name,bucket || true)
            if jq -e 'any(.[]; .workflow == "Public data checks" and .bucket == "pass")' <<<"$checks" >/dev/null; then
              if jq -e 'all(.[] | select(.workflow != "Knowledge PR admission"); .bucket == "pass" or .bucket == "skipping")' <<<"$checks" >/dev/null; then seen=true; break; fi
            fi
            sleep 15
          done
          test "$seen" = true
          checked
          gh api -X POST "$endpoint/reviews" -f commit_id="$HEAD_SHA" -f event=APPROVE -f body='Schema, registry, pinned evidence and semantic audit passed for this commit.'
          checked
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA"
          for attempt in {1..40}; do
            result=$(gh api "$endpoint" --jq '[.head.sha,.merged] | @tsv')
            if [[ "$result" == "$(printf '%s\ttrue' "$HEAD_SHA")" ]]; then exit 0; fi
            checked
            sleep 10
          done
          exit 1
  publish:
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cache-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
