name: Public data checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s cache -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node fixtures/react-renderers/check.cjs
      - uses: actions/checkout@v4
        with:
          repository: levencode-labs/deploom-mcp
          ref: e1533fba5141d5569c802c2f53304dc5daa6a797
          path: build/contracts
          persist-credentials: false
      - name: Validate the public snapshots with the consumer contract
        env:
          PYTHONPATH: build/contracts/src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from deploom_mcp.shared_records import validate
          for kind in ("history", "knowledge"):
              rows = json.loads(Path(f"docs/v1/{kind}.json").read_bytes())
              print(kind, len(validate(kind, rows)))
          PY
